[package]
name = "instant-integrity"
version = "1.0.0"
description = "Instant Integrity — Food Authenticity Verification"
authors = ["Instant Integrity Team"]
edition = "2021"

[lib]
name = "instant_integrity_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
